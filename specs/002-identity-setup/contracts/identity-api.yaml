openapi: 3.1.0
info:
  title: QuickBuilder — Identity HTTP contract
  version: "1.0.0"
  description: >-
    Endpoints added by feature 002. Module endpoints follow 001 FR-010a
    (/api/v1/<module>/...). Every endpoint declares its authorization per
    contracts/authorization.md; the declaration is given in each operation's
    `x-authorization`. State-changing requests MUST carry `X-QuickBuilder-Request: 1`
    (research R-11) — omitted from each operation below for brevity and applied to all
    POST/PUT/PATCH/DELETE. Errors are application/problem+json in 001's shape.
    Changes to the Sites endpoints from 001 are listed in contracts/authorization.md §5.

servers:
  - url: http://127.0.0.1:8080
    description: Reference deployment

tags:
  - name: setup
  - name: session
  - name: account
    description: The signed-in user's own account (self-service)
  - name: users
    description: Administration of accounts — requires identity.users.manage

paths:
  /api/v1/identity/status:
    get:
      tags: [setup]
      summary: Whether the installation is in setup mode
      x-authorization: AllowAnonymous
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                required: [setupRequired]
                properties:
                  setupRequired: { type: boolean }

  /api/v1/identity/setup:
    post:
      tags: [setup]
      summary: Create the first administrator (FR-002 – FR-004)
      description: >-
        Accepted only while the installation is unclaimed and only with the current
        setup code. On success the installation is claimed, the account is created
        with the Administrator role, and the caller is signed in — atomically (R-12).
      x-authorization: AllowAnonymous
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setupCode, displayName, email, password]
              properties:
                setupCode: { type: string, examples: ["ABCD-EFGH-JKMN"] }
                displayName: { type: string, maxLength: 200 }
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        "201":
          description: Installation claimed; session cookie set
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403":
          description: >-
            `identity.setup_code_invalid` (wrong or missing code) or
            `identity.https_required` (plain HTTP from a non-loopback client)
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "409":
          description: "`identity.setup_already_completed`"
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "429": { $ref: "#/components/responses/Throttled" }

  /api/v1/identity/sign-in:
    post:
      tags: [session]
      summary: Sign in with email address and password (FR-014, FR-015)
      x-authorization: AllowAnonymous
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Signed in; session cookie set
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401":
          description: >-
            `identity.invalid_credentials` — identical for unknown email, wrong
            password, account without a password and deactivated account (R-08)
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "403":
          description: "`identity.https_required`"
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "428": { $ref: "#/components/responses/SetupRequired" }
        "429": { $ref: "#/components/responses/Throttled" }

  /api/v1/identity/sign-out:
    post:
      tags: [session]
      summary: End the current session
      x-authorization: RequireSignedIn
      responses:
        "204": { description: Signed out; cookie cleared }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/identity/me:
    get:
      tags: [account]
      summary: The signed-in user, their roles and effective access
      x-authorization: RequireSignedIn
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/identity/me/password:
    post:
      tags: [account]
      summary: Change own password (FR-012)
      description: >-
        Requires the current password; subject to the per-account throttle (R-07).
        Ends every other session of this user; the current one continues.
      x-authorization: RequireSignedIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 12, maxLength: 128 }
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`identity.current_password_incorrect`"
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "429": { $ref: "#/components/responses/Throttled" }

  /api/v1/identity/me/sessions/revoke-others:
    post:
      tags: [account]
      summary: End all of my sessions except this one (FR-012a)
      x-authorization: RequireSignedIn
      responses:
        "204": { description: Other sessions ended }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/identity/set-password-links/check:
    post:
      tags: [account]
      summary: Check a set-password link before asking for a password
      description: Token in the body, never in the URL, so it never reaches access logs (R-10).
      x-authorization: AllowAnonymous
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Usable
          content:
            application/json:
              schema:
                type: object
                required: [expiresAtUtc]
                properties:
                  expiresAtUtc: { type: string, format: date-time }
        "410": { $ref: "#/components/responses/LinkInvalid" }
        "429": { $ref: "#/components/responses/Throttled" }

  /api/v1/identity/set-password:
    post:
      tags: [account]
      summary: Use a set-password link (FR-011, FR-011a)
      description: >-
        Consumes the link, sets the password, revokes all of the user's sessions. The
        caller is NOT signed in by this call; they sign in afterwards with the new
        password, which proves they know it.
      x-authorization: AllowAnonymous
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 12, maxLength: 128 }
      responses:
        "204": { description: Password set }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403":
          description: "`identity.https_required`"
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "410": { $ref: "#/components/responses/LinkInvalid" }
        "429": { $ref: "#/components/responses/Throttled" }

  /api/v1/identity/users:
    get:
      tags: [users]
      summary: List accounts
      x-authorization: RequireCapability(identity.users.manage)
      responses:
        "200":
          description: Accounts, ordered by display name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [users]
      summary: Create an account and issue its first set-password link (FR-010, FR-011)
      x-authorization: RequireCapability(identity.users.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName, email, grants]
              properties:
                displayName: { type: string, maxLength: 200 }
                email: { type: string, format: email, maxLength: 254 }
                grants: { $ref: "#/components/schemas/Grants" }
      responses:
        "201":
          description: Created. The token is shown once and never retrievable again.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [user, setPasswordLink]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  setPasswordLink: { $ref: "#/components/schemas/IssuedLink" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`identity.email_taken`"
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }

  /api/v1/identity/users/{userId}:
    parameters:
      - { $ref: "#/components/parameters/UserId" }
    get:
      tags: [users]
      summary: Get one account
      x-authorization: RequireCapability(identity.users.manage)
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404":
          description: "`identity.user_not_found`"
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    patch:
      tags: [users]
      summary: Change display name and/or email address (FR-010, FR-010a)
      description: >-
        An email change revokes all of the user's sessions, invalidates any live
        set-password link and records both addresses in the security event.
      x-authorization: RequireCapability(identity.users.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                displayName: { type: string, maxLength: 200 }
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404":
          description: "`identity.user_not_found`"
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "409":
          description: "`identity.email_taken`"
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }

  /api/v1/identity/users/{userId}/grants:
    parameters:
      - { $ref: "#/components/parameters/UserId" }
    put:
      tags: [users]
      summary: Replace the user's role grants (FR-020, FR-013)
      x-authorization: RequireCapability(identity.users.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Grants" }
      responses:
        "200":
          description: Grants replaced; effective on the user's next request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404":
          description: "`identity.user_not_found`"
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "409":
          description: "`identity.last_administrator`"
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }

  /api/v1/identity/users/{userId}/deactivate:
    parameters:
      - { $ref: "#/components/parameters/UserId" }
    post:
      tags: [users]
      summary: Deactivate (revokes sessions and live link)
      x-authorization: RequireCapability(identity.users.manage)
      responses:
        "200":
          description: Deactivated
          content: { application/json: { schema: { $ref: "#/components/schemas/User" } } }
        "404":
          description: "`identity.user_not_found`"
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "409":
          description: "`identity.last_administrator`"
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }

  /api/v1/identity/users/{userId}/reactivate:
    parameters:
      - { $ref: "#/components/parameters/UserId" }
    post:
      tags: [users]
      summary: Reactivate
      x-authorization: RequireCapability(identity.users.manage)
      responses:
        "200":
          description: Reactivated
          content: { application/json: { schema: { $ref: "#/components/schemas/User" } } }
        "404":
          description: "`identity.user_not_found`"
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }

  /api/v1/identity/users/{userId}/set-password-links:
    parameters:
      - { $ref: "#/components/parameters/UserId" }
    post:
      tags: [users]
      summary: Issue a new set-password link (onboarding or reset)
      description: Invalidates any earlier live link for the account (FR-011a).
      x-authorization: RequireCapability(identity.users.manage)
      responses:
        "201":
          description: Issued. Shown once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedLink" }
        "404":
          description: "`identity.user_not_found`"
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "409":
          description: "`identity.user_deactivated` — reactivate first"
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }

  /api/v1/identity/users/{userId}/sessions/revoke:
    parameters:
      - { $ref: "#/components/parameters/UserId" }
    post:
      tags: [users]
      summary: Sign the user out everywhere, account stays active (FR-012a)
      x-authorization: RequireCapability(identity.users.manage)
      responses:
        "204": { description: All sessions ended }
        "404":
          description: "`identity.user_not_found`"
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }

components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }

  headers:
    SessionCookie:
      description: >-
        `qb_session=<opaque>; HttpOnly; SameSite=Strict; Path=<base path>` plus `Secure`
        when the request arrived over HTTPS (R-04). No Max-Age: a browser-session cookie;
        expiry is enforced server-side. A successful sign-in or setup also sets or
        refreshes `qb_device` (same attributes, Max-Age = KnownDeviceLifetime), the
        known-device credential that exempts this browser from the per-account wait
        (FR-015a, R-07). Sign-out does not clear it.
      schema: { type: string }

  schemas:
    Problem:
      type: object
      required: [type, title, status, errorCode]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errorCode: { type: string }
        traceId: { type: string }
        errors:
          type: object
          additionalProperties: { type: array, items: { type: string } }

    SiteRole:
      type: object
      required: [siteId, role]
      properties:
        siteId: { type: string, format: uuid }
        role: { type: string, enum: [designer, editor] }

    Grants:
      type: object
      required: [administrator, siteRoles]
      properties:
        administrator: { type: boolean }
        siteRoles:
          type: array
          description: At most one entry per site (FR-020).
          items: { $ref: "#/components/schemas/SiteRole" }

    User:
      type: object
      required: [id, displayName, email, status, hasPassword, grants, createdAtUtc]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string }
        status: { type: string, enum: [active, deactivated] }
        hasPassword:
          type: boolean
          description: False until the first set-password link is used.
        grants: { $ref: "#/components/schemas/Grants" }
        createdAtUtc: { type: string, format: date-time }
        lastSignInAtUtc: { type: [string, "null"], format: date-time }

    Me:
      type: object
      required: [id, displayName, email, isAdministrator, siteRoles]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string }
        isAdministrator: { type: boolean }
        siteRoles:
          type: array
          items: { $ref: "#/components/schemas/SiteRole" }

    IssuedLink:
      type: object
      required: [token, expiresAtUtc]
      description: >-
        The admin shell builds `<its own origin + base path>/admin/set-password#token=<token>`.
        The server never returns a full URL (R-10, FR-011b).
      properties:
        token: { type: string }
        expiresAtUtc: { type: string, format: date-time }

  responses:
    ValidationFailed:
      description: "`request.invalid` with per-field `errors` (001 FR-008)"
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Unauthenticated:
      description: "`identity.unauthenticated`"
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Forbidden:
      description: "`identity.forbidden`"
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    SetupRequired:
      description: "`identity.setup_required` — the installation has not been set up"
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    LinkInvalid:
      description: >-
        `identity.link_invalid` — used, expired, replaced, or the account is deactivated;
        indistinguishable by design
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Throttled:
      description: "`identity.throttled` — see Retry-After (R-07)"
      headers:
        Retry-After: { schema: { type: integer, description: seconds } }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
