# The sub-path installation's proxy (specs/025-e2e-harness, E2E-07).
#
# The two location blocks are the ones docs/operators/reverse-proxy/index.md#sub-path-installation
# tells operators to use, served over plain HTTP: the documented procedure test already proves
# the TLS half, and what only a browser can prove here does not depend on the scheme.
server {
    listen 80;
    server_name _;

    client_max_body_size 1g;
    proxy_read_timeout   120s;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

    # QuickBuilder under /cms/, with the path kept.
    location /cms/ {
        proxy_pass http://app:8080;
        proxy_request_buffering off;
    }

    # Crawlers look for robots.txt at the root only.
    location = /robots.txt {
        proxy_pass http://app:8080/cms/robots.txt;
    }
}
