name: CI

# FR-039: runs on every pull request. Restore, build, all test suites, formatting check.
# Warnings are errors via Directory.Build.props, so a warning fails this workflow.
# FR-041: the container image is built to prove it builds, and status is reported back.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Build and test (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore QuickBuilder.slnx

      - name: Build
        run: dotnet build QuickBuilder.slnx --no-restore --configuration Release

      - name: Verify formatting
        run: dotnet format QuickBuilder.slnx --verify-no-changes --no-restore

      # Testcontainers needs a working Docker daemon; ubuntu-latest runners have one.
      # Principle X forbids in-memory database providers, so these run against real
      # PostgreSQL.
      - name: Test
        run: >
          dotnet test QuickBuilder.slnx
          --no-build
          --configuration Release
          --filter "FullyQualifiedName!~SmokeTests"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      # Principle X requires >=80% line coverage on the critical paths.
      #
      # Enforced here, in a step that can actually fail, rather than through the
      # collector's Threshold setting: the "XPlat Code Coverage" collector silently
      # ignores it. Verified — a run with Threshold=100 still exits 0. A gate that cannot
      # fail is worse than no gate, because it reads as covered.
      #
      # The bar is the constitution's 80%. The merged report covers every assembly with
      # tests, Identity included; measured at 93.4% overall after 002, with Identity at
      # 96% and every authentication, authorization and setup class at or near 100%
      # (the fail-closed wiring branches have their own unit tests).
      #
      # Coverage is still the weaker signal. The concurrency tests (SC-012), the
      # site-scoping tests (SC-011) and the fixtures proving each architecture rule fires
      # (SC-004) catch the failures that matter. This only stops whole areas going dark.
      - name: Enforce coverage threshold
        env:
          MINIMUM_COVERAGE: 80
        run: |
          set -euo pipefail
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"./TestResults/**/coverage.cobertura.xml" \
            -targetdir:./TestResults/merged \
            -reporttypes:Cobertura
          # Read the root <coverage> element only. Piping every match into `head -1`
          # kills grep with SIGPIPE (exit 141), which pipefail turns into a silent failure.
          rate=$(grep -o -m1 '<coverage [^>]*' ./TestResults/merged/Cobertura.xml | grep -o 'line-rate="[0-9.]*"' | grep -o '[0-9.]*')
          pct=$(awk "BEGIN{printf \"%.2f\", ${rate} * 100}")
          echo "Line coverage: ${pct}% (minimum ${MINIMUM_COVERAGE}%)"
          if awk "BEGIN{exit !(${pct} < ${MINIMUM_COVERAGE})}"; then
            echo "::error::Line coverage ${pct}% is below the required ${MINIMUM_COVERAGE}%."
            exit 1
          fi

          # 003: upload, public serving, site isolation and the storage provider are
          # critical paths in their own right, so each assembly must clear the bar alone —
          # a well-covered rest of the codebase must not carry an untested new module.
          # 009: site resolution lives in Sites (directory, aggregate), the kernel (the
          # host-name rules) and the host (the resolution and admin-host middlewares).
          # 010: the page tree, the document validator and draft storage are the start of
          # the publish and render path (research P-19).
          # 011: design tokens feed rendering (#12) the same way, so the Editor module joins.
          # 012: the renderer and the public page path are critical paths (publish, render).
          # 015: item publishing, schedules and the schema migration live in Cms (plan, Principle X).
          for package in QuickBuilder.Media QuickBuilder.Shared.Infrastructure QuickBuilder.Sites QuickBuilder.Shared.Kernel QuickBuilder.Host QuickBuilder.Pages QuickBuilder.Editor QuickBuilder.Rendering QuickBuilder.Cms; do
            package_rate=$(grep -o "<package name=\"${package}\"[^>]*" ./TestResults/merged/Cobertura.xml | grep -o 'line-rate="[0-9.]*"' | grep -o '[0-9.]*' || true)
            if [ -z "${package_rate}" ]; then
              echo "::error::No coverage recorded for ${package}."
              exit 1
            fi
            package_pct=$(awk "BEGIN{printf \"%.2f\", ${package_rate} * 100}")
            echo "${package}: ${package_pct}%"
            if awk "BEGIN{exit !(${package_pct} < ${MINIMUM_COVERAGE})}"; then
              echo "::error::${package} line coverage ${package_pct}% is below the required ${MINIMUM_COVERAGE}%."
              exit 1
            fi
          done
          echo "Coverage gate passed."

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ./TestResults

  admin:
    name: Build and test (admin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/admin/package-lock.json

      - run: npm ci
      - run: npm run type-check
      # SC-013: the no-raw-text rule fails the build on any string written into a screen.
      - run: npm run lint
      - run: npm run test

  image:
    name: Build container image
    runs-on: ubuntu-latest
    needs: [backend, admin]
    steps:
      - uses: actions/checkout@v4

      # D-15: build for the runner architecture only. Multi-arch publishing belongs to
      # the release spec, which is out of scope for this feature.
      - name: Build image
        run: docker build -t quickbuilder:ci .

  # 012 FR-041: the reference deployment journey, on the built image with the reference
  # compose file. A required check: if the image, the compose file or the journey
  # (setup → create page → publish → view) breaks, the build fails. QB_SMOKE_REQUIRE_DOCKER
  # makes a runner without Docker fail instead of skipping the test and passing.
  smoke:
    name: Smoke (reference deployment)
    runs-on: ubuntu-latest
    needs: [image]
    env:
      QB_SMOKE_REQUIRE_DOCKER: '1'
      QB_SMOKE_LOG_DIR: ${{ github.workspace }}/compose-logs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run the reference journey
        run: dotnet test tests/QuickBuilder.SmokeTests --configuration Release --filter "Category=Smoke" --logger "console;verbosity=normal"

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs-smoke
          path: compose-logs/

  # The performance budgets (002 sign-in, 003 media, 009 resolution, 010 page tree, 011
  # editor, 012 rendering) are set for the reference environment: 2 dedicated CPUs, 4 GB.
  # Shared GitHub runners are slower and noisier than that — the same run has missed the
  # sign-in and media budgets by 2–5x while nothing had changed — so a missed budget here
  # is reported, not fatal: the numbers go to the run summary and a miss is a warning.
  # The budgets are asserted on the reference environment in each feature's quickstart
  # run. Decided on PR #31 (2026-09-30), refining analysis I1 of 012.
  performance:
    name: Performance (report only)
    runs-on: ubuntu-latest
    needs: [image]
    env:
      QB_SMOKE_REQUIRE_DOCKER: '1'
      QB_SMOKE_LOG_DIR: ${{ github.workspace }}/compose-logs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run the performance tests
        id: perf
        continue-on-error: true
        run: |
          set -o pipefail
          dotnet test tests/QuickBuilder.SmokeTests --configuration Release --filter "Category=Performance" \
            --logger "console;verbosity=detailed" | tee perf.log

      - name: Report the numbers
        if: always()
        run: |
          {
            echo "## Performance (report only; budgets are for the reference environment)"
            echo
            echo '```'
            grep -E "p95|p50|Passed|Failed|SC-0[0-9]+|took|above|below" perf.log | sed -E 's/^\[xUnit.net [0-9:.]+\] +//' | sort -u || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.perf.outcome }}" != "success" ]; then
            echo "::warning title=Performance budgets::One or more budgets were missed on this runner. See the run summary; the budgets are asserted on the reference environment."
          fi

      - name: Upload compose logs
        if: steps.perf.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs-performance
          path: compose-logs/
