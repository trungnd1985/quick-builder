name: Promote release

# 019 FR-009a, research RL-06: the maintainer's approval of a release candidate. Run it from the
# Actions tab with the tag once the draft release's notes are right; only people with write
# access can. GitHub Free offers no required reviewers on a private repository's environments,
# so approval is this deliberate, manual run instead.
#
# It refuses unless the Release run for the tag succeeded (every gate passed) and the draft
# carries no failure banner. It tags exactly the digest the gates tested, read from the draft's
# digests.txt (no rebuild, nobody types a digest), and publishes the notes.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release candidate's tag, e.g. v0.1.0 or v0.1.0-rc.1
        required: true
        type: string

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/trungnd1985/quickbuilder
  TAG: ${{ inputs.tag }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  promote:
    name: Promote ${{ inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: The candidate passed every gate
        run: |
          conclusion=$(gh run list --workflow release.yml --branch "$TAG" --event push --limit 1 --json conclusion --jq '.[0].conclusion // ""')
          if [ "$conclusion" != "success" ]; then
            echo "::error::The Release run for ${TAG} did not succeed (${conclusion:-no run}). Fix it and tag again; nothing was promoted."
            exit 1
          fi
          draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
          if [ "$draft" != "true" ]; then
            echo "::error::${TAG} has no draft release waiting (already published?)."
            exit 1
          fi
          if gh release view "$TAG" --json body --jq '.body' | grep -q '\*\*Not available'; then
            echo "::error::The draft of ${TAG} says a gate failed."
            exit 1
          fi

      - name: The tested digest
        id: candidate
        run: |
          gh release download "$TAG" --pattern digests.txt --dir candidate
          reference=$(head -n1 candidate/digests.txt)
          digest="${reference#*@}"
          case "$digest" in sha256:*) ;; *) echo "::error::digests.txt does not name a digest: ${reference}"; exit 1 ;; esac
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Version, and whether the moving tags move
        id: version
        run: |
          dotnet build tools/QuickBuilder.Release --configuration Release --nologo -v q
          list=$(gh release list --exclude-drafts --exclude-pre-releases --limit 200 --json tagName --jq '[.[].tagName] | join(" ")')
          dotnet tools/QuickBuilder.Release/bin/Release/net10.0/qb-release.dll version check --tag "$TAG" --available "$list" | tee -a "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tag the tested image
        run: |
          version="${{ steps.version.outputs.version }}"
          digest="${{ steps.candidate.outputs.digest }}"
          # FR-005: an exact version never moves to a different build; promoting again is a no-op.
          existing=$(docker buildx imagetools inspect "${IMAGE}:${version}" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest' || true)
          if [ -n "$existing" ] && [ "$existing" != "null" ] && [ "$existing" != "$digest" ]; then
            echo "::error::${version} is already published as ${existing}."
            exit 1
          fi
          tags=(-t "${IMAGE}:${version}")
          if [ "${{ steps.version.outputs.highest }}" = "true" ]; then
            IFS=. read -r major minor _ <<< "$version"
            tags+=(-t "${IMAGE}:${major}.${minor}" -t "${IMAGE}:${major}" -t "${IMAGE}:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "${IMAGE}@${digest}"

      - name: Publish the release
        run: |
          flags=(--draft=false)
          [ "${{ steps.version.outputs.prerelease }}" = "true" ] && flags+=(--prerelease)
          [ "${{ steps.version.outputs.highest }}" = "true" ] && flags+=(--latest)
          gh release edit "$TAG" "${flags[@]}"
          echo "Published ${TAG}: ${IMAGE}:${{ steps.version.outputs.version }} (${{ steps.candidate.outputs.digest }})" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        if: steps.version.outputs.prerelease != 'true'
        with:
          node-version: '24'

      # 026 T085 (research OD-08, OD-09, OD-14; contracts/docs-publishing.md §3): the release
      # is published, so its documentation is too, as the version of its minor line. Only that
      # line's folder and its versions.json entry change; the root moves only for the highest
      # stable release. Pre-releases publish no documentation. The target is this repository's
      # gh-pages branch unless DOCS_PAGES_REPOSITORY names another (with DOCS_DEPLOY_KEY).
      - name: Publish the documentation
        if: steps.version.outputs.prerelease != 'true'
        env:
          DOCS_PAGES_REPOSITORY: ${{ vars.DOCS_PAGES_REPOSITORY || github.repository }}
          DOCS_DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          refuse() {
            echo "::error::Documentation for ${version} was not published: set DOCS_PAGES_REPOSITORY (and DOCS_DEPLOY_KEY) to a repository with GitHub Pages enabled. The release itself is published. ($1)"
            exit 1
          }

          # The site the Release run built and checked; rebuilt from the tag only if it expired.
          run_id=$(gh run list --workflow release.yml --branch "$TAG" --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // ""')
          mkdir -p site-build
          if [ -z "$run_id" ] || ! gh run download "$run_id" --name docs-site --dir site-build; then
            echo "The docs-site artifact is gone; rebuilding it from ${TAG}."
            dotnet build tools/QuickBuilder.Docs --configuration Release --nologo -v q
            IFS=. read -r major minor _ <<< "${version%%-*}"
            (cd docs/operators && npm ci && QB_DOCS_BASE="/${DOCS_PAGES_REPOSITORY#*/}/${major}.${minor}/" QB_DOCS_RELEASE="${version}" npm run build)
            rm -rf site-build && cp -r docs/operators/.vitepress/dist site-build
          fi

          if [ -n "${DOCS_DEPLOY_KEY}" ]; then
            mkdir -p ~/.ssh && printf '%s\n' "${DOCS_DEPLOY_KEY}" > ~/.ssh/docs_deploy && chmod 600 ~/.ssh/docs_deploy
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/docs_deploy -o StrictHostKeyChecking=accept-new"
            remote="git@github.com:${DOCS_PAGES_REPOSITORY}.git"
          else
            remote="https://x-access-token:${GH_TOKEN}@github.com/${DOCS_PAGES_REPOSITORY}.git"
          fi

          if git ls-remote --exit-code --heads "$remote" gh-pages > /dev/null 2>&1; then
            git clone --quiet --depth 1 --branch gh-pages "$remote" pages || refuse "cannot read gh-pages"
          else
            git init --quiet pages && git -C pages checkout --quiet --orphan gh-pages && git -C pages remote add origin "$remote"
          fi

          dotnet build tools/QuickBuilder.Docs --configuration Release --nologo -v q
          dotnet tools/QuickBuilder.Docs/bin/Release/net10.0/qb-docs.dll publish prepare \
            --site pages --build site-build --version "$version" --highest "${{ steps.version.outputs.highest }}"

          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "docs: publish ${version}" || { echo "Nothing changed."; exit 0; }
          git push --quiet origin gh-pages || { git pull --quiet --rebase origin gh-pages && git push --quiet origin gh-pages; } || refuse "push refused"

          if ! gh api "repos/${DOCS_PAGES_REPOSITORY}/pages" > /dev/null 2>&1; then
            refuse "GitHub Pages is not enabled on ${DOCS_PAGES_REPOSITORY}"
          fi
          echo "Documentation published for ${version}." >> "$GITHUB_STEP_SUMMARY"
