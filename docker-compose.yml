# QuickBuilder — reference deployment (FR-037).
#
# `docker compose up` gets you a working admin interface in under five minutes with no
# manual database work (SC-001).
#
# ─────────────────────────────────────────────────────────────────────────────────────
#  READ THIS BEFORE CHANGING THE PORT BINDING (002 FR-033)
#
#  The admin interface requires sign-in, and a fresh installation is claimed with a
#  one-time setup code printed in the app's logs (`docker compose logs app`). Until
#  setup is finished, whoever reads that code first becomes the administrator.
#
#  So the app is published on 127.0.0.1 below by default: finish setup from this
#  machine first. After that you may widen the binding, but only behind an HTTPS proxy:
#    1. put a TLS-terminating reverse proxy in front of the app;
#    2. list it in Hosting__KnownProxies__0 so client addresses (used for sign-in
#       throttling) and the HTTPS check are taken from it and not spoofed;
#    3. set Identity__AllowInsecureHttp to "false";
#    4. set Hosting__PublicUrl so recovery links printed by
#       `identity recovery-link` are complete.
#  See docs/operations.md.
# ─────────────────────────────────────────────────────────────────────────────────────

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: quickbuilder
      POSTGRES_USER: quickbuilder
      # CHANGE THIS before any real use (FR-038). It is a placeholder, not a default.
      POSTGRES_PASSWORD: change-me-before-real-use
    volumes:
      - db-data:/var/lib/postgresql/data
    # Not published at all: only the app needs to reach the database, and it does so over
    # the compose network. Publishing a database port is how installations get found.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickbuilder -d quickbuilder"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  app:
    # The published release image (019). Install from the docker-compose.yml attached to a
    # release: it names an exact version here, and upgrading means changing that version
    # (docs/operations.md, "Upgrading and rolling back"). To build from this checkout
    # instead, add the build override:
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ${QUICKBUILDER_IMAGE:-ghcr.io/trungnd1985/quickbuilder:0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The one required setting. Must match the credentials above.
      ConnectionStrings__Default: "Host=db;Port=5432;Database=quickbuilder;Username=quickbuilder;Password=change-me-before-real-use"

      # Migrations run automatically on startup. Set false to apply them yourself with
      # `docker compose run --rm app dotnet QuickBuilder.Host.dll migrate` (FR-023).
      Database__AutoMigrate: "true"

      # Empty means no telemetry exporter is registered and nothing leaves the process
      # (FR-031b). The installation works fully offline.
      Telemetry__OtlpEndpoint: ""

      # Behind a reverse proxy, name it here so forwarded headers are trusted. Empty
      # means none are, which is deliberate: sites are resolved from the Host header, so
      # a spoofable forwarded host would let a caller choose which site they reach.
      # Also required before widening the binding: per-client sign-in throttling and the
      # HTTPS rule read the client address from the proxy you name here.
      # Hosting__KnownProxies__0: "10.0.0.5"

      # The address people use to reach this installation, e.g. https://cms.example.com.
      # Used only to print complete links from `identity recovery-link`; the app never
      # guesses its own address from request headers.
      # Hosting__PublicUrl: "https://cms.example.com"

      # Accept sign-in over plain HTTP. Safe ONLY while the port below stays bound to
      # 127.0.0.1: inside the container, requests from this machine arrive from the Docker
      # network, not from loopback, so the app cannot tell them apart from a remote client.
      # Before widening the binding, put an HTTPS proxy in front and set this to "false".
      # The app logs a warning at every start while this is on.
      Identity__AllowInsecureHttp: "true"
    volumes:
      # Uploaded media (003). Back this up together with db-data: the database records which
      # files exist, this volume holds their bytes. See docs/operations.md, "Media storage".
      # If you deploy without this file, mount persistent storage at the same path.
      - media-data:/var/lib/quickbuilder/media
    ports:
      # 127.0.0.1 — see the warning at the top of this file.
      # QUICKBUILDER_PORT changes the host port (default 8080). The smoke tests use it to
      # run beside a real deployment without touching it.
      - "127.0.0.1:${QUICKBUILDER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

volumes:
  db-data:
  media-data:
